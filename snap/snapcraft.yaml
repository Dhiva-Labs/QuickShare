name: nearshare
title: NearShare
version: '1.0.3'
summary: Share files with nearby Android, Windows, macOS, and Linux devices
description: |
  NearShare speaks Google's Quick Share / Nearby Share wire protocol
  directly, so it interoperates with:

    - Android Quick Share
    - Windows Quick Share
    - macOS NearDrop
    - itself, Linux <-> Linux

  No cables, no cloud account, and no companion app on the phone -- just a
  shared WiFi network (or NearShare's own experimental Direct-mode
  hotspot) and a 4-digit PIN you confirm on both screens.

  Discovery uses mDNS (python-zeroconf, which binds its own multicast
  sockets rather than talking to Avahi) plus an optional Bluetooth LE
  "wake up" beacon so an Android phone's share sheet notices this machine
  proactively. Every transfer is end-to-end encrypted (UKEY2 key
  exchange, then AES-256-CBC + HMAC-SHA256 per frame) and requires a
  manual PIN confirmation on both devices -- there is no persistent
  cross-device trust (no Google-account "paired key" support).

  AFTER INSTALLING -- two commands
  --------------------------------
  Bluetooth discovery and Direct mode need interfaces that snapd does
  not connect automatically. Run both, then start the app:

    sudo snap connect nearshare:bluez
    sudo snap connect nearshare:network-manager

  Without bluez the app still works, but your phone may only see this
  machine while the phone's own Quick Share screen is open. Without
  network-manager, Direct mode (the built-in hotspot for when there is
  no shared WiFi) is unavailable. Everything else -- discovery,
  sending, receiving -- works with no extra setup.

  Optional: a Super+Shift+S shortcut to toggle visibility can be bound
  from the app's own setup panel, or with `nearshare install`.

  Right-click "Send with NearShare" in Files
  ------------------------------------------
  Not available in the snap. Strict confinement forbids writing to
  ~/.local/share/nautilus, so no snap can install a Files extension.
  If you want right-click sharing, install the Debian package instead:

    sudo add-apt-repository ppa:dhiva-labs/apps
    sudo apt install nearshare

  The .deb ships a system-wide Files extension and needs no per-user
  setup. Both builds are the same application otherwise.

icon: data/icons/dev.dhivalabs.nearshare.svg
license: MIT
grade: stable
confinement: strict
base: core24
compression: lzo

platforms:
  amd64:
  arm64:

# Received/sent files and the app's own persistent state should live
# against the user's REAL home directory, not the per-revision sandbox
# snapd points $HOME at by default ($SNAP_USER_DATA). Without this,
# nearshare/core/service.py's default download_dir (Path.home() /
# "Downloads") would quietly write into
# ~/snap/nearshare/current/Downloads instead of the Downloads folder
# Nautilus/the user actually sees. XDG_CONFIG_HOME etc. are left alone
# (snapd points those at the per-revision sandbox already, which is the
# right place for nearshare/core/names.py's cache file) -- only HOME
# itself is overridden, and only for the two apps below.
environment:
  HOME: $SNAP_REAL_HOME

apps:
  # Named to match the snap itself, so `snap run nearshare <args>` and
  # (once the snap is installed) the bare `nearshare <args>` alias both
  # dispatch straight to nearshare.cli's argparse subcommands (on/off/
  # toggle/status/peers/send/rename/forget/gui/...), exactly like the
  # non-snap `bin/nearshare` wrapper does.
  nearshare:
    command: bin/nearshare-cli
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - network-manager
      - bluez
      - home
      - removable-media
    environment:
      HOME: $SNAP_REAL_HOME

  # `nearshare.gui` -- the desktop launcher target. Runs `python -m
  # nearshare` (the GTK app) directly rather than going through
  # nearshare.cli's own "gui" subcommand, so there's one less exec hop
  # and no dependency on argv handling in two different places.
  gui:
    command: bin/nearshare-gui
    extensions: [gnome]
    desktop: usr/share/applications/dev.dhivalabs.nearshare.desktop
    plugs:
      - network
      - network-bind
      - network-manager
      - bluez
      - home
      - removable-media
    environment:
      HOME: $SNAP_REAL_HOME

parts:
  nearshare:
    plugin: python
    source: .
    # python3-venv/python3-dev/libffi/libssl: build-time headers in case
    # cryptography/protobuf/grpcio-tools need to build a wheel from
    # sdist on an architecture with no prebuilt wheel on PyPI (normally
    # unnecessary on amd64/arm64, where manylinux wheels exist for all
    # three, but cheap insurance and keeps the build from hard-failing
    # on a slower-to-get-wheels architecture).
    build-packages:
      - python3-venv
      - python3-dev
      - libffi-dev
      - libssl-dev
    # Runtime Python dependencies per README.md's `pip install zeroconf
    # protobuf cryptography`. GTK4/libadwaita/PyGObject are NOT pip
    # packages here (there's no PyPI wheel that reliably matches a given
    # system's GObject-Introspection typelibs -- see
    # nearshare/__main__.py's own comment on this) -- the gnome
    # extension below provides that runtime instead, the same way
    # README.md's non-snap install uses `apt install python3-gi
    # gir1.2-gtk-4.0 gir1.2-adw-1` alongside (not inside) the venv.
    python-packages:
      - zeroconf
      - protobuf
      - cryptography
    # nmcli (Direct-mode hotspot, nearshare/core/hotspot.py) is invoked
    # as a subprocess by binary name -- strict confinement doesn't let a
    # snap exec arbitrary host binaries, so the nmcli executable itself
    # has to ship inside the snap. The `network-manager` interface
    # (plugged, manually connected) separately grants the D-Bus access
    # this staged nmcli needs to reach the HOST's NetworkManager daemon;
    # staging the package alone does not grant that access, and plugging
    # the interface alone would leave the app with no nmcli binary to
    # run in the first place -- both halves are required together.
    stage-packages:
      - network-manager
    override-build: |
      craftctl default

      # ---- protobuf codegen (tools/genproto.sh) --------------------
      # protos/*.proto -> nearshare/proto/*_pb2.py. Not committed
      # upstream (gitignored -- tied to the protobuf runtime version),
      # regenerated here against this build's own protobuf/grpcio-tools.
      # grpcio-tools is BUILD-time only. It is installed into a THROWAWAY
      # venv rather than the app venv: `craftctl default` above finishes
      # by pointing the app venv's bin/python3 at the base snap's system
      # interpreter, so a pip run there resolves to the externally-managed
      # system environment and dies with PEP 668
      # (error: externally-managed-environment). A separate venv also
      # keeps grpcio (a large native-code dependency) out of the shipped
      # snap entirely -- only the generated *_pb2.py sources ship.
      # NB: /usr/bin/python3 explicitly. The python plugin puts the app
      # venv's bin first on PATH, and that interpreter cannot create a
      # new venv here (Permission denied on its own bin/python3).
      protogen=/tmp/nearshare-protogen
      rm -rf "$protogen"
      /usr/bin/python3 -m venv "$protogen"
      "$protogen"/bin/pip install --no-cache-dir --upgrade pip
      "$protogen"/bin/pip install --no-cache-dir grpcio-tools protobuf
      bash "$CRAFT_PART_SRC"/tools/genproto.sh "$protogen"/bin/python3
      rm -rf "$protogen"

      # ---- stage the nearshare package itself ---------------------
      # This project has no pyproject.toml/setup.py: the non-snap
      # `bin/nearshare` launcher works by cd-ing to the project root
      # and running `python -m nearshare.cli`, relying on the CWD for
      # the package to be importable (see bin/nearshare). The python
      # plugin above only pip-installed the three runtime dependencies
      # into the venv for that same reason -- there is no packaging
      # metadata for it to additionally `pip install` the source itself.
      # Reproduce the CWD trick instead of inventing packaging metadata
      # this task isn't allowed to add outside snap/: stage the package
      # tree under $SNAP/app and have both wrapper scripts below cd
      # there before invoking python3 -m nearshare(.cli).
      mkdir -p "$CRAFT_PART_INSTALL"/app
      cp -r "$CRAFT_PART_SRC"/nearshare "$CRAFT_PART_INSTALL"/app/nearshare
      find "$CRAFT_PART_INSTALL"/app/nearshare -name '__pycache__' -exec rm -rf {} +
      find "$CRAFT_PART_INSTALL"/app/nearshare -name '*.pyc' -delete

      # ---- launcher wrappers -----------------------------------------
      # `command:` can't itself `cd` first, so each app gets a tiny
      # wrapper (mirrors what bin/nearshare does for the non-snap
      # install).
      mkdir -p "$CRAFT_PART_INSTALL"/bin
      cat > "$CRAFT_PART_INSTALL"/bin/nearshare-cli <<'WRAP'
      #!/bin/sh
      set -e
      cd "$SNAP/app"
      exec "$SNAP/bin/python3" -m nearshare.cli "$@"
      WRAP
      cat > "$CRAFT_PART_INSTALL"/bin/nearshare-gui <<'WRAP'
      #!/bin/sh
      set -e
      cd "$SNAP/app"
      exec "$SNAP/bin/python3" -m nearshare "$@"
      WRAP
      chmod 755 "$CRAFT_PART_INSTALL"/bin/nearshare-cli \
                "$CRAFT_PART_INSTALL"/bin/nearshare-gui

  desktop-files:
    plugin: dump
    source: data
    organize:
      icons/dev.dhivalabs.nearshare.svg: usr/share/icons/hicolor/scalable/apps/dev.dhivalabs.nearshare.svg
      dev.dhivalabs.nearshare.desktop: usr/share/applications/dev.dhivalabs.nearshare.desktop
    # Only the main app launcher ships: nearshare-send.desktop (Nautilus
    # %F argument passing) and nearshare-toggle.desktop (meant to be
    # targeted by an absolute-path gsettings custom keybinding, per
    # nearshare/cli.py's _print_shortcut_commands) don't map onto a
    # strictly-confined snap's desktop-file export, which only wires up
    # the ONE file referenced by an app's `desktop:` key above -- see
    # packaging/SNAP.md.
    stage:
      - usr/share/icons/hicolor/scalable/apps/dev.dhivalabs.nearshare.svg
      - usr/share/applications/dev.dhivalabs.nearshare.desktop
    override-build: |
      # The dump plugin populates the install dir with hard links, which
      # fails outright if an earlier interrupted build left files there.
      # Start from empty so rebuilds are idempotent.
      rm -rf "${CRAFT_PART_INSTALL:?}"/*
      craftctl default
      # snapd's desktop-file export rewrites only the Exec= line's
      # first (command) token to the real /snap/bin/nearshare.gui
      # path, and keeps everything after the first space as literal
      # arguments. Upstream's `Exec=nearshare gui` is correct for the
      # non-snap install (bin/nearshare dispatches its own "gui"
      # subcommand), but unchanged here it would become
      # "/snap/bin/nearshare.gui gui" -- a stray "gui" argv reaching
      # apps.gui's wrapper, which already execs `python -m nearshare`
      # directly and doesn't expect one. Strip it so the rewrite lands
      # on a bare invocation.
      #
      # NOTE: this runs during the BUILD step, which is before
      # craft-parts applies the `organize:` mapping above -- at this
      # point the file is still at its pre-organize (pull-time) path,
      # i.e. straight from `source: data`, not yet moved under
      # usr/share/applications/. Patch it there; organize (a distinct,
      # later lifecycle step) then moves the already-patched file into
      # place before staging.
      sed -i 's/^Exec=nearshare gui$/Exec=nearshare/' \
        "$CRAFT_PART_INSTALL"/dev.dhivalabs.nearshare.desktop
