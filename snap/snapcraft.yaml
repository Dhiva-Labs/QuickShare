name: quickshare
title: QuickShare
version: '1.0.0'
summary: Share files with nearby Android, Windows, macOS, and Linux devices
description: |
  QuickShare speaks Google's Quick Share / Nearby Share wire protocol
  directly, so it interoperates with:

    - Android Quick Share
    - Windows Quick Share
    - macOS NearDrop
    - itself, Linux <-> Linux

  No cables, no cloud account, and no companion app on the phone -- just a
  shared WiFi network (or QuickShare's own experimental Direct-mode
  hotspot) and a 4-digit PIN you confirm on both screens.

  Discovery uses mDNS (python-zeroconf, which binds its own multicast
  sockets rather than talking to Avahi) plus an optional Bluetooth LE
  "wake up" beacon so an Android phone's share sheet notices this machine
  proactively. Every transfer is end-to-end encrypted (UKEY2 key
  exchange, then AES-256-CBC + HMAC-SHA256 per frame) and requires a
  manual PIN confirmation on both devices -- there is no persistent
  cross-device trust (no Google-account "paired key" support).

  See packaging/SNAP.md in the source tree for the full list of snap
  interfaces this needs and why, including two confinement caveats worth
  knowing before you install: the Nautilus right-click "Send with
  QuickShare" integration cannot be installed by a strictly-confined
  snap (use the .deb or a from-source install for that), and the
  `quickshare install`/`uninstall` CLI subcommands mostly no-op here
  because they target dotfile paths under $HOME (~/.local/bin,
  ~/.local/share/applications, ~/.local/share/nautilus*) that the `home`
  interface deliberately does not grant access to.
icon: data/icons/dev.dhivalabs.quickshare.svg
license: MIT
grade: stable
confinement: strict
base: core24
compression: lzo

platforms:
  amd64:
  arm64:

# Received/sent files and the app's own persistent state should live
# against the user's REAL home directory, not the per-revision sandbox
# snapd points $HOME at by default ($SNAP_USER_DATA). Without this,
# quickshare/core/service.py's default download_dir (Path.home() /
# "Downloads") would quietly write into
# ~/snap/quickshare/current/Downloads instead of the Downloads folder
# Nautilus/the user actually sees. XDG_CONFIG_HOME etc. are left alone
# (snapd points those at the per-revision sandbox already, which is the
# right place for quickshare/core/names.py's cache file) -- only HOME
# itself is overridden, and only for the two apps below.
environment:
  HOME: $SNAP_REAL_HOME

apps:
  # Named to match the snap itself, so `snap run quickshare <args>` and
  # (once the snap is installed) the bare `quickshare <args>` alias both
  # dispatch straight to quickshare.cli's argparse subcommands (on/off/
  # toggle/status/peers/send/rename/forget/gui/...), exactly like the
  # non-snap `bin/quickshare` wrapper does.
  quickshare:
    command: bin/quickshare-cli
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - network-manager
      - bluez
      - home
      - removable-media
    environment:
      HOME: $SNAP_REAL_HOME

  # `quickshare.gui` -- the desktop launcher target. Runs `python -m
  # quickshare` (the GTK app) directly rather than going through
  # quickshare.cli's own "gui" subcommand, so there's one less exec hop
  # and no dependency on argv handling in two different places.
  gui:
    command: bin/quickshare-gui
    extensions: [gnome]
    desktop: usr/share/applications/dev.dhivalabs.quickshare.desktop
    plugs:
      - network
      - network-bind
      - network-manager
      - bluez
      - home
      - removable-media
    environment:
      HOME: $SNAP_REAL_HOME

parts:
  quickshare:
    plugin: python
    source: .
    # python3-venv/python3-dev/libffi/libssl: build-time headers in case
    # cryptography/protobuf/grpcio-tools need to build a wheel from
    # sdist on an architecture with no prebuilt wheel on PyPI (normally
    # unnecessary on amd64/arm64, where manylinux wheels exist for all
    # three, but cheap insurance and keeps the build from hard-failing
    # on a slower-to-get-wheels architecture).
    build-packages:
      - python3-venv
      - python3-dev
      - libffi-dev
      - libssl-dev
    # Runtime Python dependencies per README.md's `pip install zeroconf
    # protobuf cryptography`. GTK4/libadwaita/PyGObject are NOT pip
    # packages here (there's no PyPI wheel that reliably matches a given
    # system's GObject-Introspection typelibs -- see
    # quickshare/__main__.py's own comment on this) -- the gnome
    # extension below provides that runtime instead, the same way
    # README.md's non-snap install uses `apt install python3-gi
    # gir1.2-gtk-4.0 gir1.2-adw-1` alongside (not inside) the venv.
    python-packages:
      - zeroconf
      - protobuf
      - cryptography
    # nmcli (Direct-mode hotspot, quickshare/core/hotspot.py) is invoked
    # as a subprocess by binary name -- strict confinement doesn't let a
    # snap exec arbitrary host binaries, so the nmcli executable itself
    # has to ship inside the snap. The `network-manager` interface
    # (plugged, manually connected) separately grants the D-Bus access
    # this staged nmcli needs to reach the HOST's NetworkManager daemon;
    # staging the package alone does not grant that access, and plugging
    # the interface alone would leave the app with no nmcli binary to
    # run in the first place -- both halves are required together.
    stage-packages:
      - network-manager
    override-build: |
      craftctl default

      # ---- protobuf codegen (tools/genproto.sh) --------------------
      # protos/*.proto -> quickshare/proto/*_pb2.py. Not committed
      # upstream (gitignored -- tied to the protobuf runtime version),
      # regenerated here against this build's own protobuf/grpcio-tools.
      # grpcio-tools is a BUILD-time-only dependency: installed into the
      # venv just long enough to run genproto.sh, then removed so it
      # (and grpcio, its large native-code dependency) don't ship in the
      # final snap -- only the generated *_pb2.py source files do.
      "$CRAFT_PART_INSTALL"/bin/pip install --no-cache-dir grpcio-tools
      bash "$CRAFT_PART_SRC"/tools/genproto.sh "$CRAFT_PART_INSTALL"/bin/python3
      "$CRAFT_PART_INSTALL"/bin/pip uninstall -y grpcio-tools grpcio

      # ---- stage the quickshare package itself ---------------------
      # This project has no pyproject.toml/setup.py: the non-snap
      # `bin/quickshare` launcher works by cd-ing to the project root
      # and running `python -m quickshare.cli`, relying on the CWD for
      # the package to be importable (see bin/quickshare). The python
      # plugin above only pip-installed the three runtime dependencies
      # into the venv for that same reason -- there is no packaging
      # metadata for it to additionally `pip install` the source itself.
      # Reproduce the CWD trick instead of inventing packaging metadata
      # this task isn't allowed to add outside snap/: stage the package
      # tree under $SNAP/app and have both wrapper scripts below cd
      # there before invoking python3 -m quickshare(.cli).
      mkdir -p "$CRAFT_PART_INSTALL"/app
      cp -r "$CRAFT_PART_SRC"/quickshare "$CRAFT_PART_INSTALL"/app/quickshare
      find "$CRAFT_PART_INSTALL"/app/quickshare -name '__pycache__' -exec rm -rf {} +
      find "$CRAFT_PART_INSTALL"/app/quickshare -name '*.pyc' -delete

      # ---- launcher wrappers -----------------------------------------
      # `command:` can't itself `cd` first, so each app gets a tiny
      # wrapper (mirrors what bin/quickshare does for the non-snap
      # install).
      mkdir -p "$CRAFT_PART_INSTALL"/bin
      cat > "$CRAFT_PART_INSTALL"/bin/quickshare-cli <<'WRAP'
      #!/bin/sh
      set -e
      cd "$SNAP/app"
      exec "$SNAP/bin/python3" -m quickshare.cli "$@"
      WRAP
      cat > "$CRAFT_PART_INSTALL"/bin/quickshare-gui <<'WRAP'
      #!/bin/sh
      set -e
      cd "$SNAP/app"
      exec "$SNAP/bin/python3" -m quickshare "$@"
      WRAP
      chmod 755 "$CRAFT_PART_INSTALL"/bin/quickshare-cli \
                "$CRAFT_PART_INSTALL"/bin/quickshare-gui

  desktop-files:
    plugin: dump
    source: data
    organize:
      icons/dev.dhivalabs.quickshare.svg: usr/share/icons/hicolor/scalable/apps/dev.dhivalabs.quickshare.svg
      dev.dhivalabs.quickshare.desktop: usr/share/applications/dev.dhivalabs.quickshare.desktop
    # Only the main app launcher ships: quickshare-send.desktop (Nautilus
    # %F argument passing) and quickshare-toggle.desktop (meant to be
    # targeted by an absolute-path gsettings custom keybinding, per
    # quickshare/cli.py's _print_shortcut_commands) don't map onto a
    # strictly-confined snap's desktop-file export, which only wires up
    # the ONE file referenced by an app's `desktop:` key above -- see
    # packaging/SNAP.md.
    stage:
      - usr/share/icons/hicolor/scalable/apps/dev.dhivalabs.quickshare.svg
      - usr/share/applications/dev.dhivalabs.quickshare.desktop
    override-build: |
      craftctl default
      # snapd's desktop-file export rewrites only the Exec= line's
      # first (command) token to the real /snap/bin/quickshare.gui
      # path, and keeps everything after the first space as literal
      # arguments. Upstream's `Exec=quickshare gui` is correct for the
      # non-snap install (bin/quickshare dispatches its own "gui"
      # subcommand), but unchanged here it would become
      # "/snap/bin/quickshare.gui gui" -- a stray "gui" argv reaching
      # apps.gui's wrapper, which already execs `python -m quickshare`
      # directly and doesn't expect one. Strip it so the rewrite lands
      # on a bare invocation.
      #
      # NOTE: this runs during the BUILD step, which is before
      # craft-parts applies the `organize:` mapping above -- at this
      # point the file is still at its pre-organize (pull-time) path,
      # i.e. straight from `source: data`, not yet moved under
      # usr/share/applications/. Patch it there; organize (a distinct,
      # later lifecycle step) then moves the already-patched file into
      # place before staging.
      sed -i 's/^Exec=quickshare gui$/Exec=quickshare/' \
        "$CRAFT_PART_INSTALL"/dev.dhivalabs.quickshare.desktop
